; RE4 Modern Controls settings. Everything works without touching this file.
; To change an option, remove the ';' in front of it and edit the value.
; Saved changes apply while the game runs. Re-running the installer also edits this file.

[Movement]
; Always    = Leon runs whenever the stick is pushed; hold the game's run button to walk
; OuterRing = run when the stick is pushed past OuterRing, walk below it
; Button    = the game's own run button (vanilla)
;Run=Always
;OuterRing=0.85
; Degrees per second Leon turns toward the stick direction
;TurnSpeed=515

[Aim]
; 1 = while aiming the left stick walks
;Walk=1
; 1 = Leon's legs step while he walks aiming (RE4 has no strafe animations; without this he glides).
; LegsStride = game units per full cycle (two steps), LegsSwing / LegsKnee = thigh swing and knee bend (radians)
;Legs=1
;LegsStride=1400
;LegsSwing=0.45
;LegsKnee=0.8
; Game units per second at full deflection (Leon walks about 1500)
;WalkSpeed=1300
; The same while reloading without aiming (X alone): Leon keeps walking, his legs in his walk animation
;ReloadSpeed=1700
; 1 = crosshair where the laser points, in addition to the laser
;Crosshair=1
; 1 = remake-style aim: raising the gun keeps the view where it looked, the crosshair stays in the middle of the
;     screen and the laser and shots go there; 0 = the original aim camera, the crosshair moves with the laser
;CenteredAim=1
; 1 = raising the gun keeps what was in the middle of the screen in the middle and Leon aims there (like the
;     remakes); 0 = the view swings to where Leon looks (level)
;KeepViewOnAim=1
; The aim camera's spot over Leon's right shoulder (game units, about mm): sideways, behind along the view, and the
; shoulder's height above his feet. Changes apply while the game runs.
;ShoulderRight=400
;ShoulderBack=750
;ShoulderHeight=1550
; 1 = a small dot in the middle of the screen outside of aiming too, where the aim will start (with CenteredAim)
;CenterDot=1
; 1 = your guns and knife don't hurt Ashley, the way her armour costume protects her (explosions still do)
;ProtectAshley=1

[Buttons]
; 1 = hide the action prompts ("X Open", "X Save", kicks): A does the action, so their X icon would mislead.
HideActionPrompt=1
; 1 = quick-time events pass on their own (their prompts are hidden too). Takes effect after a restart.
AutoQTE=1
; 1 = A takes the everyday pickups straight away (ammo, grenades, herbs, eggs, fish, Spinel and Velvet Blue,
;     money), without the pickup screen and its Yes/No. When it doesn't fit, the case opens to make room, as always.
;     Weapons, key items, the bigger treasures and the other important finds keep their screen.
;QuickPickup=1
; 1 = a line in small print at the left edge says what was taken that way ("Handgun Ammo x30")
;PickupTicker=1
; RE5 = LT aim, RT fire, LB knife, A action, X reload (also without aiming), B hold to walk, Y inventory, Back map,
;       Start options; Original = the game's own layout (RT aim, X action/fire, A run/reload, LT knife, Y map,
;       Start inventory, Back options). Menus always use the original layout.
;Layout=RE5
; The controller type chosen in the game's own Controller Setup, so the mod presses the right buttons:
; 1 = Type I (RT aim, LT knife, RB Ashley; the default), 2 = Type II (RB aim, LB knife, RT Ashley),
; 3 = Type III (LT aim, RT fire, LB knife, RB Ashley)
;GameType=1

[Camera]
; Where the camera rests vertically, in degrees relative to the game's camera (+ = higher, looking down)
;DefaultPitch=12
; Moves the free camera to the right, over Leon's shoulder (game units; 0 = centred behind him like the original)
;Shoulder=300
; How far the free camera is from Leon, as a share of the original distance (1 = original, 0.6 = RE5-like)
;Distance=0.6
; But never closer than this behind Leon (game units; the game brings its own camera closer in some areas). Walls
; still pull the camera in. 0 = always the share above
;MinDistance=1100
; Raises the whole camera (game units; 0 = the original camera height, 250 = a bit higher)
;Height=0
; 1 = Leon and Ashley fade out when the camera gets close to them (walls behind Leon, Ashley right behind him)
;Fade=1
; Distance from the camera to the body (game units): fully visible above FadeFar, the most see-through step below
; FadeNear, one step halfway in between
;FadeNear=350
;FadeFar=650
; How visible the most see-through step is (0..1; never fully hidden)
;FadeMin=0.3
; Degrees per second at full right-stick deflection
;YawSpeed=170
;PitchSpeed=100
; While Leon moves and the right stick is left alone, the camera eases round behind him.
; Degrees per second (0 = off) and the seconds of right-stick rest before it starts.
;AutoFollow=80
;AutoFollowDelay=1.0
; At the same time the view tilts slowly back to DefaultPitch (degrees per second, 0 = off)
;AutoCenter=10
;InvertX=0
;InvertY=0

[Weapons]
; Weapon quick select on the d-pad, like the remake: during gameplay each direction equips the next weapon Leon carries
; from its list, and pressing it again moves on through the list. Menus and the inventory keep the d-pad.
; 0 = the d-pad keeps the original tank controls instead.
;DpadSelect=1
; After the last grenade (or egg) is thrown, Leon takes the weapon he had before it instead of standing empty-handed.
;Rearm=1
; The lists, as the game's item numbers (re4_tweaks' weapon hotkey cycles): up handguns and magnums, right shotguns,
; down rifles, machine guns and launchers, left grenades and eggs. Up to 16 per direction.
;Up=35,37,33,39,3,41,42,55
;Right=44,45,71,148
;Down=16,46,47,48,52,83,53,109,54
;Left=1,2,14,8,9,10
